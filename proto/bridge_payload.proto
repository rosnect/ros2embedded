syntax = "proto3";

package ros2embedded.v1;

message BridgePayload {
  string identifier = 1;
  uint32 domain_id = 2;
  uint64 timestamp_unix_ns = 3;
  oneof value {
    bool bool_value = 10;
    int32 int32_value = 11;
    uint32 uint32_value = 12;
    int64 int64_value = 13;
    uint64 uint64_value = 14;
    float float32_value = 15;
    double float64_value = 16;
    string string_value = 17;
    bytes bytes_value = 18;
    // UTF-8 JSON text for structured clients such as phone sensors.
    string json_value = 19;
  }
}
